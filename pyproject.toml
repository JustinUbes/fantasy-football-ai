[project]
name = "fantasy-football-ai"
version = "0.1.0"
description = "AI-powered fantasy football analyst"
requires-python = ">=3.11"
dependencies = [
    "rag-nfl-analyst @ file:///Users/justinubele/code/rag-nfl-analyst",
    "nfl-data-py>=0.3.4",
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.5.0",
]

[project.scripts]
ffa = "src.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
